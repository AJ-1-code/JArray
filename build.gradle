
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.yourname'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.register('testjarray', JavaExec) {
    group = 'verification'
    description = 'Runs the JArray test suite'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'jarray.JArrayTest'
}

tasks.register('bench', JavaExec) {
    group = 'verification'
    description = 'Runs the JArray Benchmark'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'jarray.JArrayBenchmark'
}


